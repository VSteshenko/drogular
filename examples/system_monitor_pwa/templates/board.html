<section hidden data-board-connection data-connection-live-region
         dg-get="/fragments/system"
         dg-target="[data-board-connection-fragment]"
         dg-trigger="every 2s"
         dg-failure-limit="3"
         dg-pause-on-failure
         dg-connection="[data-dg-connection-status]"
         dg-retry="[data-dg-connection-retry]">
    <div data-board-connection-fragment></div>
</section>

<section class="hero board-hero">
    <div>
        <p class="eyebrow">{{ t("board.overview") }}</p>
        <h2>{{ boardModel }}</h2>
        <p class="muted">{{ hostname }} · {{ hardwareSubtitle }}</p>
    </div>
    <a class="secondary-link dg-button" href="/">{{ t("board.system_dashboard") }}</a>
</section>

<section class="board-live-region dg-interaction"
         data-board-live-region
         dg-get="/fragments/hardware"
         dg-target="[data-board-fragment-host]"
         dg-trigger="every 30s"
         dg-poll-group="monitor">
    <div data-board-fragment-host>{{{ hardwareFragmentHtml }}}</div>
</section>
