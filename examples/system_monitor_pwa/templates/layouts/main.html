<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
    <header class="site-header">
        <div class="shell header-content">
            <div>
                <p class="eyebrow">Drogular example</p>
                <h1>{{ title }}</h1>
            </div>
            <div class="connection-status">
                <div class="connection-status-content">
                    <span class="status" data-monitor-status>
                        <span class="status-dot"></span>
                        <span data-monitor-status-label>Live</span>
                    </span>
                    <span class="status-detail" data-monitor-status-detail hidden></span>
                </div>
                <button class="retry-button" type="button" data-monitor-retry hidden>Retry</button>
            </div>
        </div>
    </header>

    <main class="shell">
        @content
    </main>
    <script src="/assets/app.js" defer></script>
</body>
</html>
