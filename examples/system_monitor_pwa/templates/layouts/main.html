<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    {{{ manifestLink }}}
    {{{ themeColorMeta }}}
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
    <header class="site-header">
        <div class="shell header-content">
            <div>
                <p class="eyebrow">Drogular example</p>
                <h1>{{ title }}</h1>
            </div>
            <nav class="site-nav" aria-label="System monitor sections">
                <a href="/">System</a>
                <a href="/hardware">Hardware</a>
            </nav>
            <div class="connection-status">
                <div class="connection-status-content">
@if(hasPageScript)
                    <span class="status" data-monitor-status>
                        <span class="status-dot"></span>
                        <span data-monitor-status-label>Live</span>
                    </span>
                    <span class="status-detail" data-monitor-status-detail hidden></span>
@else
                    <span class="status status-offline">
                        <span class="status-dot"></span>
                        <span>Offline</span>
                    </span>
@endif
                </div>
@if(hasPageScript)
                <button class="retry-button" type="button" data-monitor-retry hidden>Retry</button>
@endif
            </div>
        </div>
    </header>

    <main class="shell">
        @content
    </main>
@if(hasPageScript)
    <script src="{{ pageScript }}" defer></script>
@endif
    {{{ serviceWorkerRegistration }}}
</body>
</html>
