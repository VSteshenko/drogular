<header class="dg-page-header">
    <h1 class="dg-page-title">
        @if(editing){{ t('staff.category.edit') }}@else{{ t('staff.category.new') }}@endif
    </h1>
</header>
<form class="dg-card" method="post" action="/staff/categories/save">
    <div class="dg-card-body dg-form-grid">
        <input type="hidden" name="id" value="{{ id }}">
        <label class="dg-field">
            <span class="dg-label">Slug</span>
            <input class="dg-input" name="slug" value="{{ slug }}" required>
        </label>
        <label class="dg-field">
            <span class="dg-label">{{ t('staff.category.name_en') }}</span>
            <input class="dg-input" name="nameEn" value="{{ nameEn }}" required>
        </label>
        <label class="dg-field">
            <span class="dg-label">{{ t('staff.category.name_de') }}</span>
            <input class="dg-input" name="nameDe" value="{{ nameDe }}" required>
        </label>
    </div>
    <div class="dg-card-footer">
        <button class="dg-button dg-button-primary" type="submit">{{ t('staff.save') }}</button>
        <a class="dg-button"
           href="/staff/categories"
           dg-get="/fragments/staff/categories"
           dg-trigger="click"
           dg-target="[data-staff-content]"
           dg-history="push"
           dg-history-url="/staff/categories">
            {{ t('staff.cancel') }}
        </a>
    </div>
</form>
