<header class="dg-page-header mini-store-staff-form-header">
    <h1 class="dg-page-title">
        @if(editing){{ t('staff.category.edit') }}@else{{ t('staff.category.new') }}@endif
    </h1>
</header>
<form class="mini-store-staff-form-surface" method="post" action="/staff/categories/save">
    <div class="mini-store-staff-form-grid">
        <input type="hidden" name="id" value="{{ id }}">
        <label class="mini-store-staff-field">
            <span class="mini-store-staff-field-label">Slug</span>
            <input class="mini-store-staff-control" name="slug" value="{{ slug }}" required>
        </label>
        <label class="mini-store-staff-field">
            <span class="mini-store-staff-field-label">{{ t('staff.category.name_en') }}</span>
            <input class="mini-store-staff-control" name="nameEn" value="{{ nameEn }}" required>
        </label>
        <label class="mini-store-staff-field">
            <span class="mini-store-staff-field-label">{{ t('staff.category.name_de') }}</span>
            <input class="mini-store-staff-control" name="nameDe" value="{{ nameDe }}" required>
        </label>
    </div>
    <div class="mini-store-staff-form-actions">
        <button class="mini-store-staff-primary-action" type="submit">{{ t('staff.save') }}</button>
        <a class="mini-store-staff-secondary-action"
           href="/staff/categories"
           dg-get="/fragments/staff/categories"
           dg-trigger="click"
           dg-target="[data-staff-content]"
           dg-history="push"
           dg-history-url="/staff/categories">
            {{ t('staff.cancel') }}
        </a>
    </div>
</form>
