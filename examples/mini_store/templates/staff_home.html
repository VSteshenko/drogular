<header class="dg-page-header"><p class="dg-page-kicker">Mini Store Staff</p><h1 class="dg-page-title">Dashboard</h1></header>
<div class="dg-card-grid">
    <section class="dg-card">
        <div class="dg-card-body">
            <p class="dg-card-subtitle">Products</p>
            <h2 class="dg-card-title">{{ productCount }}</h2>
        </div>
    </section>
    <section class="dg-card">
        <div class="dg-card-body">
            <p class="dg-card-subtitle">Low stock</p>
            <h2 class="dg-card-title">{{ lowStockCount }}</h2>
        </div>
    </section>
    <section class="dg-card">
        <div class="dg-card-body">
            <p class="dg-card-subtitle">Orders</p>
            <h2 class="dg-card-title">{{ orderCount }}</h2>
        </div>
    </section>
    <section class="dg-card">
        <div class="dg-card-body">
            <p class="dg-card-subtitle">New orders</p>
            <h2 class="dg-card-title">{{ newOrderCount }}</h2>
        </div>
    </section>
</div>
<p class="dg-card-subtitle">Catalog and order management are added in the next Stage E steps.</p>
