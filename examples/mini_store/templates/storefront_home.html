<section class="dg-card">
    <div class="dg-card-body">
        <p class="dg-card-subtitle">{{ t('home.kicker') }}</p>
        <h1 class="dg-card-title">{{ t('home.heading') }}</h1>
        <p>{{ t('home.description') }}</p>
        <p>
            <a class="dg-button" href="/catalog">{{ t('home.browse') }}</a>
        </p>
    </div>
</section>
<div class="dg-card-grid">

        <div class="dg-card-body">
            <p class="dg-card-subtitle">{{ t('home.products') }}</p>
            <h2 class="dg-card-title">{{ productCount }}</h2>
        </div>
    </section>
    <section class="dg-card">
        <div class="dg-card-body">
            <p class="dg-card-subtitle">{{ t('home.categories') }}</p>
            <h2 class="dg-card-title">{{ categoryCount }}</h2>
