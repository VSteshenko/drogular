<!doctype html>
<html lang="{{ locale }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ pageTitle }} — {{ t('app.title') }}</title>
    {{{ manifestLink }}}
    {{{ faviconLink }}}
    {{{ themeColorMeta }}}
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/__drogular/assets/ui.css">
    <link rel="stylesheet" href="/assets/theme.css">
    <link rel="stylesheet" href="/assets/storefront.css">
    <script src="/__drogular/assets/interactions.js" defer></script>
    <script src="/assets/navigation.js" defer></script>
</head>
<body>
<header class="dg-topbar">
    <a class="dg-brand"
       href="/"
       dg-get="/fragments/storefront"
       dg-trigger="click"
       dg-target="[data-storefront-content]"
       dg-history="push"
       dg-history-url="/">
        {{ t('app.title') }}
    </a>
    <nav class="dg-nav" aria-label="Store navigation">
        <a class="dg-nav-item"
           href="/"
           dg-get="/fragments/storefront"
           dg-trigger="click"
           dg-target="[data-storefront-content]"
           dg-history="push" dg-history-url="/">
            {{ t('nav.home') }}
        </a>
        <a class="dg-nav-item"
           href="/catalog"
           dg-get="/fragments/storefront/catalog"
           dg-trigger="click"
           dg-target="[data-storefront-content]"
           dg-history="push"
           dg-history-url="/catalog">
            {{ t('nav.catalog') }}
        </a>
        <a class="dg-nav-item"
           href="/cart"
           dg-get="/fragments/storefront/cart"
           dg-trigger="click"
           dg-target="[data-storefront-content]"
           dg-history="push"
           dg-history-url="/cart">
            {{ t('nav.cart') }}
        </a>
        <a class="dg-nav-item" href="/staff">{{ t('nav.staff') }}</a>
    </nav>
    <div class="dg-actions">
        <div class="mini-store-theme-picker">
            <label for="mini-store-theme">{{ t('theme.label') }}</label>
            <select id="mini-store-theme" class="dg-input mini-store-theme-select" data-theme-select>
                <option value="modern">{{ t('theme.modern') }}</option>
                <option value="dark">{{ t('theme.dark') }}</option>
                <option value="warm">{{ t('theme.warm') }}</option>
            </select>
        </div>
        <form method="post" action="/language">
            <input type="hidden" name="language" value="en">
            <input type="hidden" name="redirect" value="{{ languageRedirect }}">
            <button class="dg-button" type="submit">EN</button>
        </form>
        <form method="post" action="/language">
            <input type="hidden" name="language" value="de">
            <input type="hidden" name="redirect" value="{{ languageRedirect }}">
            <button class="dg-button" type="submit">DE</button>
        </form>
    </div>
</header>
<main data-storefront-content>
    <div class="dg-page">
    <header class="dg-page-header">
        <p class="dg-page-kicker">{{ t('app.title') }}</p>
        <h1 class="dg-page-title">{{ pageTitle }}</h1>
    </header>
    <div class="dg-page-content">@content</div>
    </div>
</main>
    {{{ serviceWorkerRegistration }}}
</body>
</html>
