<main class="dg-page mini-store-page{{ pageClass }}"

        <p class="dg-page-kicker">{{ t('app.title') }}</p>
        <h1 class="dg-page-title">{{ pageTitle }}</h1>
    </header>
    <div class="dg-page-content mini-store-page-content">@content</div>
</main>
