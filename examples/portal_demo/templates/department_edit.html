@if(departmentNotFound)
<h2>{{ t('departments.not_found') }}
</h2>
@else
<h2>
    {{ pageTitle }}
</h2>

<form method="post" action="/departments/{{ departmentId }}/update">
    <div>
        <label>
            {{ t('departments.name') }}
            <input
                    name="name"
                    value="{{ departmentName }}"
                    required />
        </label>
    </div>

    <div>
        <label>
            {{ t('departments.description') }}
            <input
                    name="description"
                    value="{{ departmentDescription }}" />
        </label>
    </div>

    <div>
        <label>
            {{ t('departments.manager') }}
            <select name="managerId">
                @foreach(manager in departmentManagers)
                <option
                        value="{{ manager.id }}"
                        @if(manager.selected)selected@endif
                >
                    {{ manager.name }}
                </option>
                @endforeach
            </select>
        </label>
    </div>

    <div>
        <label>
            <input
                    type="checkbox"
                    name="isActive"
                    @if(departmentActive)checked@endif
            />
            {{ t('departments.active') }}
        </label>
    </div>

    <div>
        <button type="submit">{{ t('departments.save') }}</button>
    </div>
</form>
@endif
