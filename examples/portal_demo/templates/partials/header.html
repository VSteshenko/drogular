<header>
    <div style="display:flex; align-items:center; gap:1rem;">
        <h1 style="margin-right:auto;">{{ t('app.title') }}</h1>
    </div>

    @if(isAuthenticated)
        <nav>
            <a href="/dashboard">{{ t('nav.dashboard') }}</a>
            |
            <a href="/users">{{ t('nav.users') }}</a>
            |
            <a href="/projects">{{ t('nav.projects') }}</a>
            |
            <a href="/departments">{{ t('nav.departments') }}</a>
            @if(isAdmin)
            |
            <a href="/admin">{{ t('nav.admin') }}</a>
            @endif
            |
            <form method="post" action="/logout" style="display:inline">
                <button
                        type="submit"
                        style="border:none; background:none; padding:0; color:blue; text-decoration:underline; cursor:pointer;">
                    {{ t('nav.logout') }}
                </button>
            </form>
        </nav>
    @endif

    <div style="display:flex; align-items:center; gap:0.75rem;">
        @if(isAuthenticated)
            <small>
                {{ t('header.signed_in_as') }}: {{ currentUsername }}
            </small>
        @endif

        <div>
            <form method="post" action="/language" style="display:inline">
                <input type="hidden" name="language" value="en">
                <input type="hidden" name="redirect" value="{{ currentPath }}">
                <button type="submit" @if(locale == "en")disabled@endif>
                    EN
                </button>
            </form>

            <form method="post" action="/language" style="display:inline">
                <input type="hidden" name="language" value="de">
                <input type="hidden" name="redirect" value="{{ currentPath }}">
                <button type="submit" @if(locale == "de")disabled@endif>
                    DE
                </button>
            </form>
        </div>
    </div>

    <hr>
</header>
