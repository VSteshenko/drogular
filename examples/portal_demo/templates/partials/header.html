<header>
    <div class="dg-toolbar">
        <h1>{{ t('app.title') }}</h1>
    </div>

    @if(isAuthenticated)
        <nav>
            <a href="/dashboard">{{ t('nav.dashboard') }}</a>
            |
            <a href="/users">{{ t('nav.users') }}</a>
            |
            <a href="/projects">{{ t('nav.projects') }}</a>
            |
            <a href="/departments">{{ t('nav.departments') }}</a>
            @if(isAdmin)
            |
            <a href="/admin">{{ t('nav.admin') }}</a>
            @endif
            |
            <form method="post" action="/logout" style="display:inline">
                <button
                        class="dg-button"
                        type="submit">
                    {{ t('nav.logout') }}
                </button>
            </form>
        </nav>
    @endif

    <div class="dg-toolbar">
        @if(isAuthenticated)
            <small>
                {{ t('header.signed_in_as') }}: {{ currentUsername }}
            </small>
        @endif

        <div class="dg-segmented" aria-label="Language">
            <form method="post" action="/language" style="display:inline">
                <input type="hidden" name="language" value="en">
                <input type="hidden" name="redirect" value="{{ currentPath }}">
                <button
                        class="dg-segmented-item @if(locale == "en")is-active@endif"
                        type="submit"
                        @if(locale == "en")disabled@endif>
                    EN
                </button>
            </form>

            <form method="post" action="/language" style="display:inline">
                <input type="hidden" name="language" value="de">
                <input type="hidden" name="redirect" value="{{ currentPath }}">
                <button
                        class="dg-segmented-item @if(locale == "de")is-active@endif"
                        type="submit"
                        @if(locale == "de")disabled@endif>
                    DE
                </button>
            </form>
        </div>
    </div>

    <hr>
</header>
