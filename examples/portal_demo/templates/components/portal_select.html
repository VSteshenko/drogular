<select
    @if(hasSelectId)id="{{ selectId }}"@endif
    name="{{ name }}"
    @if(selectRequired)required@endif
    @if(selectDisabled)disabled@endif
>
    @foreach(item in selectOptions)
    <option
        value="{{ item.value }}"
        @if(item.selected)selected@endif
        @if(item.disabled)disabled@endif
    >@if(item.labelKey){{ t(item.labelKey) }}@else{{ item.label }}@endif</option>
    @endforeach
</select>
