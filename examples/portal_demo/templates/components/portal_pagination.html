@if(paginationModel.visible)
<nav aria-label="{{ ariaLabel }}">
    @if(paginationModel.hasPrevious)
    <a href="{{ paginationModel.previousUrl }}">{{ previousLabel }}</a>
    @endif

    @foreach(item in paginationModel.pages)
    @if(item.current)
    <strong aria-current="page">{{ item.number }}</strong>
    @else
    <a href="{{ item.url }}">{{ item.number }}</a>
    @endif
    @endforeach

    @if(paginationModel.hasNext)
    <a href="{{ paginationModel.nextUrl }}">{{ nextLabel }}</a>
    @endif
</nav>
@endif
